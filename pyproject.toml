[project]
name = "neuro-workflow"
version = "0.2.0"
description = "CLI for submitting neuroimaging SLURM array jobs"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

[project.scripts]
neuro-run = "neuro_workflow.cli:main"

[project.optional-dependencies]
lev1 = [
    "statsmodels>=0.14",
    "randomise-prep @ git+https://github.com/jmumford/randomise-prep.git",
]
qa = [
    "nilearn>=0.12",
    "nibabel>=5.0",
    "matplotlib>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "img2pdf>=0.5",
    "seaborn>=0.13",
    "bold-reliability-movies>=0.1",
]
bidsify = [
    "flywheel-sdk>=17.0",
]
events = [
    "pandas>=2.0",
    "numpy>=1.24",
    "nibabel>=5.0",
]
datalad = [
    "datalad<1.0",
]
# Aggregate of the analysis/CLI extras (everything except the heavy datalad
# optional). Install with `uv sync --extra all` / `pip install neuro-workflow[all]`
# so `submit lev1/lev2/mshbm`, the `qa` commands, and `python -m
# neuro_workflow.analysis.*` all import (RE-2).
all = [
    "neuro-workflow[lev1,qa,bidsify,events]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
markers = [
    "lev1: requires neuroimaging dependencies (nibabel, nilearn, statsmodels)",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv.sources]
bold-reliability-movies = { git = "https://github.com/lobennett/bold-reliability-movies.git", tag = "v0.1.3" }

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git,.gitignore,.gitattributes,*.lock,validator-outputs,*.min.js,*.min.css,*/archive/*'
check-hidden = true
# ignore-regex = ''
# FWE = Family-Wise Error (standard neuroimaging stats acronym; not a typo of "few").
ignore-words-list = 'fwe'
