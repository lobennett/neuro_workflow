[project]
name = "neuro-workflow"
version = "0.2.0"
description = "CLI for submitting neuroimaging SLURM array jobs"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
neuro-run = "neuro_workflow.cli:main"

[project.optional-dependencies]
lev1 = [
    "statsmodels>=0.14",
    "randomise-prep @ git+https://github.com/jmumford/randomise-prep.git",
]
qa = [
    "nilearn>=0.12",
    "nibabel>=5.0",
    "matplotlib>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "img2pdf>=0.5",
    "seaborn>=0.13",
    "jinja2>=3.0",
    "bold-reliability-movies>=0.1",
]
bidsify = [
    "flywheel-sdk>=17.0",
]
events = [
    "pandas>=2.0",
    "numpy>=1.24",
    "nibabel>=5.0",
]
datalad = [
    "datalad<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
markers = [
    "lev1: requires neuroimaging dependencies (nibabel, nilearn, statsmodels)",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.uv.sources]
bold-reliability-movies = { path = "/home/users/logben/bold-reliability-movies", editable = true }

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git,.gitignore,.gitattributes,*.lock,validator-outputs'
check-hidden = true
# ignore-regex = ''
# ignore-words-list = ''
