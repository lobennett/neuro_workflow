[project]
name = "neuro-workflow"
version = "0.2.0"
description = "CLI for submitting neuroimaging SLURM array jobs"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

[project.scripts]
neuro-run = "neuro_workflow.cli:main"

[project.optional-dependencies]
lev1 = [
    "statsmodels>=0.14",
    "randomise-prep @ git+https://github.com/jmumford/randomise-prep.git",
]
qa = [
    "nilearn>=0.12",
    "nibabel>=5.0",
    "matplotlib>=3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "img2pdf>=0.5",
    "seaborn>=0.13",
    "bold-reliability-movies>=0.1",
]
bidsify = [
    # Pinned for a reproducible live Flywheel pull (Oak re-execution): the pull
    # behavior must not drift if the container is rebuilt. Matches uv.lock.
    "flywheel-sdk==21.5.0",
]
events = [
    "pandas>=2.0",
    "numpy>=1.24",
    "nibabel>=5.0",
]
datalad = [
    "datalad<1.0",
]
# Aggregate of the analysis/CLI extras (everything except the heavy datalad
# optional). Install with `uv sync --extra all` / `pip install neuro-workflow[all]`
# so `submit lev1/lev2/mshbm`, the `qa` commands, and `python -m
# neuro_workflow.analysis.*` all import (RE-2).
all = [
    "neuro-workflow[lev1,qa,bidsify,events]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
markers = [
    "lev1: requires neuroimaging dependencies (nibabel, nilearn, statsmodels)",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.6,<0.7",
    "pre-commit>=3.8",
]

[tool.uv.sources]
bold-reliability-movies = { git = "https://github.com/lobennett/bold-reliability-movies.git", tag = "v0.1.3" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "external"]

[tool.ruff.lint]
# Conservative starting set — expand later once clean.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter, not the linter

[tool.ruff.lint.per-file-ignores]
# These files deliberately place imports next to the section/task that first
# uses them (scripts organize a "paths" block before a "hermetic seam" import
# block; tests colocate an import with the numbered task/section it exercises)
# rather than hoisting everything to the top. E402 fights that established,
# intentional layout, so it is narrowed to just these files instead of fixed
# by restructuring (which would reduce readability for no behavior benefit).
"scripts/reproduce_cohort.py" = ["E402"]
"scripts/recompile_delta.py" = ["E402"]
"tests/analysis/e2e/test_reproduce_units.py" = ["E402"]
"tests/analysis/test_synthetic_cohort.py" = ["E402"]
"tests/exclusions/test_render.py" = ["E402"]
"tests/qa/test_lev1_outliers.py" = ["E402"]
"tests/scripts/test_fmriprep_preflight.py" = ["E402"]

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git,.gitignore,.gitattributes,*.lock,validator-outputs,*.min.js,*.min.css,*/archive/*'
check-hidden = true
# ignore-regex = ''
# FWE = Family-Wise Error (standard neuroimaging stats acronym; not a typo of "few").
ignore-words-list = 'fwe'
