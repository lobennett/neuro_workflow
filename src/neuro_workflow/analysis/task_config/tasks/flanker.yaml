tr: 1.49
dummy_scans: 7
min_rt: 0.2
expected_sessions: 5
has_performance_feedback_breaks: true

# Eriksen flanker task
# Trial types: congruent, incongruent
# The response_time regressor uses RT as duration (RTDur model).

regressors:
  congruent:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2
      and trial_type == 'congruent'

  incongruent:
    amplitude: 1
    duration: 1
    subset: >-
      key_press == correct_response and response_time >= 0.2
      and trial_type == 'incongruent'

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      key_press == correct_response and response_time >= 0.2
      and trial_id == 'test_trial'

  omission:
    amplitude: omission
    duration: 1
    subset: null

  commission:
    amplitude: commission
    duration: 1
    subset: null

  rt_fast:
    amplitude: rt_too_fast
    duration: 1
    subset: null

  break_with_performance_feedback:
    amplitude: 1
    duration: 1
    subset: "trial_id == 'break_with_performance_feedback'"

contrasts:
  incongruent-congruent: "incongruent - congruent"
  task-baseline: "0.5 * congruent + 0.5 * incongruent"
  response_time: "response_time"
